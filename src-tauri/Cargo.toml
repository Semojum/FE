[package]
name = "semojum"
version = "3.0.19"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "semojum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-process = "2"
# 다운로드 저장 위치 선택 — 저장 대화상자로 고른 경로에만 쓴다.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# 접속 환경(OS)을 X-Client-Os 헤더로 실어 보내기 위한 플러그인.
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 자동 업데이트는 데스크톱에서만 지원 (모바일 빌드에서는 제외)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
