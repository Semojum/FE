[package]
name = "semojum"
version = "3.2.3"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "semojum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-process = "2"
# 다운로드 저장 위치 선택 — 저장 대화상자로 고른 경로에만 쓴다.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# 접속 환경(OS)을 X-Client-Os 헤더로 실어 보내기 위한 플러그인.
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 개발자 모드 오버레이의 RAM·CPU 수치 — 웹뷰에서는 프로세스 메모리도 CPU도 볼 수 없다
# (performance.memory는 JS 힙뿐이고, 그 값은 실제 사용량의 일부다 — 2026-08-27 인수시험에서
#  JS 힙 7MB일 때 렌더러가 1.2GB였다). 그래서 네이티브에서 읽어 넘긴다.
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

# 자동 업데이트는 데스크톱에서만 지원 (모바일 빌드에서는 제외)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
