name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치/PR 에서 새 푸시가 들어오면 진행 중인 잡을 취소해서 자원 절약
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type check, test, build
    runs-on: ubuntu-latest
    steps:
      # 점자 조판 라이브러리(vendor/braille-assist)를 서브모듈로 받는다. 없으면
      # vite alias가 가리키는 소스가 비어 타입 검사·빌드가 모두 실패한다
      # (build.yml에는 있었지만 여기 빠져 있어 CI가 계속 빨간불이었다).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      # 훅 규칙 위반(rules-of-hooks 등)은 여기서 막는다. 경고는 통과시키되 로그에 보인다.
      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Build (verifies prod bundle compiles)
        run: bun run build
