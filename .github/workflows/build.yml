name: Build Desktop App

# 배포 타깃은 Windows 데스크톱 앱 하나다. macOS·Linux 번들은 만들지 않는다.
# (개발은 다른 OS에서 해도 되지만 릴리스 산출물은 Windows만 발행한다.)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    # 레포 기본 토큰 권한이 read라 릴리스 생성이 403으로 막힌다(2026-08-07 v3.0.0 태그에서 확인).
    # 레포 설정을 통째로 열지 않고 이 워크플로에만 쓰기 권한을 준다.
    permissions:
      contents: write

    env:
      TARGET: x86_64-pc-windows-msvc

    steps:
      # 점자 조판 라이브러리(vendor/braille-assist)를 서브모듈로 받는다. 없으면
      # vite alias가 가리키는 소스가 비어 프런트 빌드가 실패한다.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # 태그 푸시: 빌드 후 GitHub Release(초안) 생성 + 자동 업데이트용 latest.json 발행
      - name: Build and create release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 자동 업데이트 서명 (필수) — 없으면 빌드 실패
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: BrailleMate ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true
          args: --target ${{ env.TARGET }}

      # 수동 트리거: 빌드만 수행하고 산출물을 artifact로 업로드
      - name: Build only (manual trigger)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ env.TARGET }}

      - name: Upload artifacts (manual trigger)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: BrailleMate-windows
          path: |
            src-tauri/target/${{ env.TARGET }}/release/bundle/**/*.msi*
            src-tauri/target/${{ env.TARGET }}/release/bundle/**/*.exe
            src-tauri/target/${{ env.TARGET }}/release/bundle/**/*.nsis.zip*
          if-no-files-found: warn
